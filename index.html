<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>House Game</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
    #coords { position: fixed; left: 10px; bottom: 250px; color: #fff; background: #000a; padding: 6px 10px; border-radius: 6px; font: 13px/1.45 monospace; pointer-events: none; white-space: pre; }
    #minimap { position: fixed; left: 10px; bottom: 10px; width: 220px; height: 230px; border-radius: 8px; border: 1px solid #fff4; pointer-events: none; }
    #settings { position: fixed; top: 10px; right: 10px; z-index: 5; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    #settingsBtn { width: 44px; height: 44px; border: 0; border-radius: 50%; background: #0008; color: #fff; font-size: 24px; line-height: 44px; cursor: pointer; transition: transform .2s, background .2s; }
    #settingsBtn:hover { background: #000b; }
    #settingsBtn.open { background: #3aa655; transform: rotate(60deg); }
    /* Camera button: switch to the avatar's eyes and back (key C) */
    #eyeBtn { position: fixed; top: 10px; right: 62px; z-index: 5; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: #0008; color: #fff; cursor: pointer; display: grid; place-items: center; transition: background .2s; }
    #eyeBtn:hover { background: #000b; }
    #eyeBtn.on { background: #3aa655; }
    #eyeBtn svg { width: 24px; height: 24px; }
    #settingsPanel { display: flex; flex-direction: column; gap: 6px; min-width: 190px; padding: 8px; border-radius: 8px; background: #101420f2; box-shadow: 0 4px 16px #0008; }
    #settingsPanel[hidden] { display: none; }
    #settingsPanel .toggle { justify-content: space-between; }
    .toggle { color: #fff; background: #0008; padding: 8px 12px; border-radius: 6px; display: flex; align-items: center; gap: 8px; user-select: none; }
    button.toggle { border: 0; font: inherit; cursor: pointer; }
    button.toggle.on { background: #3aa655; }
    .toggle input { display: none; }
    .toggle .track { width: 44px; height: 24px; background: #777; border-radius: 12px; position: relative; transition: background .2s; }
    .toggle .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: left .2s; }
    .toggle input:checked + .track { background: #3aa655; }
    .toggle input:checked + .track::after { left: 23px; }
    #versionSelect { max-width: 130px; padding: 3px 4px; border: 0; border-radius: 4px; background: #2a3040; color: #fff; font: inherit; font-size: 12px; }
    /* Joystick: sized from the screen (about a third of its short side), kept in from the corner where a thumb rests comfortably */
    #touchPad { --joy: clamp(140px, 36vmin, 200px); position: fixed; right: calc(max(32px, 8vw) + env(safe-area-inset-right)); bottom: calc(max(40px, 11vh) + env(safe-area-inset-bottom)); display: none; width: var(--joy); height: var(--joy); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
    #joyBase { position: relative; width: var(--joy); height: var(--joy); box-sizing: border-box; border-radius: 50%; background: #0005; border: 2px solid #fff5; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    #joyBase.active { background: #0007; border-color: #7be08f; }
    #joyKnob { position: absolute; left: 50%; top: 50%; width: 42%; height: 42%; margin: -21% 0 0 -21%; border-radius: 50%; background: #ffffffcc; box-shadow: 0 2px 8px #0008; pointer-events: none; }
    /* Touch screens: a smaller minimap and coordinates box, so they do not cover the game */
    @media (pointer: coarse) {
      #minimap { width: 132px; height: 138px; left: calc(8px + env(safe-area-inset-left)); bottom: calc(8px + env(safe-area-inset-bottom)); }
      #coords { left: calc(8px + env(safe-area-inset-left)); bottom: calc(154px + env(safe-area-inset-bottom)); font-size: 11px; padding: 4px 8px; }
    }
    /* Laser pointer (eye view): the hand pad sits left of the joystick, the label follows the red dot */
    #handPad { --hand: clamp(90px, 22vmin, 120px); position: fixed; right: calc(max(32px, 8vw) + clamp(140px, 36vmin, 200px) + 24px + env(safe-area-inset-right)); bottom: calc(max(40px, 11vh) + env(safe-area-inset-bottom)); display: none; width: var(--hand); height: var(--hand); box-sizing: border-box; border-radius: 50%; background: #3a0a0a66; border: 2px solid #ff5a5a99; touch-action: none; user-select: none; -webkit-user-select: none; place-items: center; }
    #handKnob { width: 42%; height: 42%; border-radius: 50%; background: #ff7a7acc; box-shadow: 0 2px 8px #0008; pointer-events: none; }
    #laserLabel { position: fixed; z-index: 4; padding: 3px 7px; border-radius: 5px; background: #000b; color: #ff9a9a; font: 12px/1.35 monospace; white-space: pre; pointer-events: none; }
    #legend { display: none; color: #fff; background: #000b; padding: 10px 12px; border-radius: 6px; font: 13px sans-serif; }
    #legend b { display: block; margin-bottom: 6px; }
    #legend label { display: flex; align-items: center; gap: 8px; margin: 5px 0; cursor: pointer; }
    #legend i { display: inline-block; width: 20px; height: 6px; border-radius: 3px; }
    /* Switchboard card: shown when you hover (or tap) a switchboard */
    #boardInfo { position: fixed; z-index: 6; max-width: 260px; padding: 10px 12px; border-radius: 8px; background: #101420f0; color: #fff; font: 13px/1.4 sans-serif; box-shadow: 0 4px 16px #0009; border-left: 4px solid #ffc23a; pointer-events: none; }
    #boardInfo[hidden] { display: none; }
    #boardInfo h4 { margin: 0 0 6px; font-size: 13px; color: #ffd36a; }
    #boardInfo ul { margin: 0; padding: 0; list-style: none; }
    #boardInfo li { margin: 3px 0; }
    #boardInfo li small { display: block; margin-left: 22px; color: #b9c0cc; font-size: 11px; }
    #boardInfo p { margin: 6px 0 0; color: #b9c0cc; font-size: 11px; }
    #joyBase.active #joyKnob { background: #7be08fe6; }
  </style>
</head>
<body>
  <div id="settings">
    <button id="settingsBtn" title="Settings" aria-label="Settings" aria-expanded="false" aria-controls="settingsPanel">&#9881;</button>
    <div id="settingsPanel" hidden>
    <label class="toggle"><span>Transparent</span><input type="checkbox" id="transparentSwitch" checked><span class="track"></span></label>
    <label class="toggle" title="X-ray: see the wiring, light points, switchboards and sockets inside the walls (key X)"><span>Electrical</span><input type="checkbox" id="electricalSwitch"><span class="track"></span></label>
    <label class="toggle" title="X-ray: see the water pipes, tanks, pump and drains inside the walls and under the ground (key Z)"><span>Plumbing</span><input type="checkbox" id="plumbingSwitch"><span class="track"></span></label>
    <label class="toggle" title="Electrical devices: ceiling fans, tube lights, ceiling lights and exhaust fans (key E)"><span>Devices</span><input type="checkbox" id="devicesSwitch"><span class="track"></span></label>
    <label class="toggle" title="Movable furniture: beds, sofas, TV, tables, fridge, shelves (key F)"><span>Furniture</span><input type="checkbox" id="furnitureSwitch" checked><span class="track"></span></label>
    <button class="toggle" id="roomViewBtn" title="Inside a room: see the whole room in 3D with its slab">Room view</button>
    <label class="toggle" title="Design version: try another layout (kitchen...) without changing house.json"><span>Design</span><select id="versionSelect"></select></label>
    <label class="toggle" title="Laser pointer in the hand in eye view: shows the plan position of what it points at. Move the hand with I J K L, H = centre (key: camera C first)"><span>Laser</span><input type="checkbox" id="laserSwitch" checked><span class="track"></span></label>
    <label class="toggle"><span>Touch</span><input type="checkbox" id="touchSwitch" checked><span class="track"></span></label>
    </div>
    <div id="legend"><b>Services (X-ray) — X electrical, Z plumbing</b></div>
  </div>
  <button id="eyeBtn" title="Eye view: see through the avatar's eyes (C)" aria-label="Camera: eye view">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>
    </svg>
  </button>
  <div id="touchPad">
    <div id="joyBase"><div id="joyKnob"></div></div>
  </div>
  <div id="handPad" title="Move the laser hand (double tap = centre)"><div id="handKnob"></div></div>
  <canvas id="minimap" width="220" height="230"></canvas>
  <div id="coords"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
