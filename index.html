<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>House Game</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
    #coords { position: fixed; left: 10px; bottom: 250px; color: #fff; background: #000a; padding: 6px 10px; border-radius: 6px; font: 13px/1.45 monospace; pointer-events: none; white-space: pre; }
    #minimap { position: fixed; left: 10px; bottom: 10px; width: 220px; height: 230px; border-radius: 8px; border: 1px solid #fff4; pointer-events: none; }
    #toggles { position: fixed; top: 10px; right: 10px; display: flex; gap: 8px; }
    .toggle { color: #fff; background: #0008; padding: 8px 12px; border-radius: 6px; display: flex; align-items: center; gap: 8px; user-select: none; }
    button.toggle { border: 0; font: inherit; cursor: pointer; }
    button.toggle.on { background: #3aa655; }
    .toggle input { display: none; }
    .toggle .track { width: 44px; height: 24px; background: #777; border-radius: 12px; position: relative; transition: background .2s; }
    .toggle .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: left .2s; }
    .toggle input:checked + .track { background: #3aa655; }
    .toggle input:checked + .track::after { left: 23px; }
    #touchPad { position: fixed; right: 24px; bottom: 24px; display: none; width: 150px; height: 150px; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
    #joyBase { position: relative; width: 150px; height: 150px; border-radius: 50%; background: #0005; border: 2px solid #fff5; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    #joyBase.active { background: #0007; border-color: #7be08f; }
    #joyKnob { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: #ffffffcc; box-shadow: 0 2px 8px #0008; pointer-events: none; }
    #legend { position: fixed; top: 56px; right: 10px; display: none; color: #fff; background: #000b; padding: 10px 12px; border-radius: 6px; font: 13px sans-serif; }
    #legend b { display: block; margin-bottom: 6px; }
    #legend label { display: flex; align-items: center; gap: 8px; margin: 5px 0; cursor: pointer; }
    #legend i { display: inline-block; width: 20px; height: 6px; border-radius: 3px; }
    #joyBase.active #joyKnob { background: #7be08fe6; }
  </style>
</head>
<body>
  <div id="toggles">
    <label class="toggle"><span>Transparent</span><input type="checkbox" id="transparentSwitch" checked><span class="track"></span></label>
    <label class="toggle" title="X-ray: see the wiring, light points, water pipes and drains inside the walls (key X)"><span>Services</span><input type="checkbox" id="servicesSwitch"><span class="track"></span></label>
    <button class="toggle" id="roomViewBtn" title="Inside a room: see the whole room in 3D with its slab">Room view</button>
    <label class="toggle"><span>Touch</span><input type="checkbox" id="touchSwitch" checked><span class="track"></span></label>
  </div>
  <div id="legend"><b>Services (X-ray) — key X</b></div>
  <div id="touchPad">
    <div id="joyBase"><div id="joyKnob"></div></div>
  </div>
  <canvas id="minimap" width="220" height="230"></canvas>
  <div id="coords"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
